services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_satei
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d ai_satei"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_URL: postgresql+psycopg://app_user:app_password@db:5432/ai_satei
      UPLOAD_DIR: /app/uploads
    volumes:
      - upload_data:/app/uploads
    ports:
      - "18015:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "18014:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  upload_data:
